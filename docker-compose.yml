services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8080:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app/src
      - DATABASE_URL=postgresql://inti:inti_dev@db:5432/inti
    depends_on:
      - db

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app/src
      - DATABASE_URL=postgresql://inti:inti_dev@db:5432/inti
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: inti
      POSTGRES_USER: inti
      POSTGRES_PASSWORD: inti_dev
    ports:
      - "5432:5432"
    volumes:
      - inti_pg:/var/lib/postgresql/data

volumes:
  inti_pg:
